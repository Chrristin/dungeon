# On every push to main: check the theme with Ghost's validator.
# If package.json has a version with no release yet, publish it automatically:
# tag v<version>, build dungeon.zip (the name Ghost uses for the theme), and use that version's
# CHANGELOG.md section as notes. After a release, rebuild the demo site on Cloudflare Pages.
# The demo can also be rebuilt by hand: Actions -> Theme -> Run workflow.
name: Theme

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Library shelf pictures match the data and the drawing code
        run: node extras/shelves/build.mjs --check
      - name: Validate for Ghost 5 and 6
        run: |
          npx --yes gscan . --v5
          npx --yes gscan . --v6

  release:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Skip if this version is already released
        id: exists
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists; nothing to do."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make the Library shelf pictures again
        # Tried first, so the pictures in the zip always come from the code in it. If the browser here is unreliable the
        # step is allowed to fail, and the zip carries the pictures committed to the repository, which the check above
        # has already shown to be up to date.
        if: steps.exists.outputs.released == 'false'
        continue-on-error: true
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          npm run shelves
      - name: Build the zip and release notes
        if: steps.exists.outputs.released == 'false'
        run: |
          V="${{ steps.version.outputs.version }}"
          zip -r dungeon.zip . -x '.git/*' '.github/*' 'docs/*' 'demo/*' 'extras/*' 'node_modules/*' 'package-lock.json' '.gitignore'
          awk -v v="$V" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Dungeon $V" > notes.md
          cat notes.md
      - name: Publish the release
        id: publish
        if: steps.exists.outputs.released == 'false'
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release create "v$V" dungeon.zip --title "Dungeon $V" --notes-file notes.md --target "${{ github.sha }}"
          echo "published=true" >> "$GITHUB_OUTPUT"

  demo:
    # After a new release, or when run by hand from the Actions tab
    needs: [check, release]
    if: always() && needs.check.result == 'success' && (needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      DEMO_URL: ${{ vars.DEMO_URL || 'https://dungeon-demo.pages.dev' }}
      PAGES_PROJECT: ${{ vars.DEMO_PAGES_PROJECT || 'dungeon-demo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start a throwaway Ghost
        run: |
          docker run -d --name ghost -p 2368:2368 \
            -e url=http://localhost:2368 \
            -e database__client=sqlite3 \
            -e database__connection__filename=/var/lib/ghost/content/data/ghost.db \
            -e database__useNullAsDefault=true \
            -e security__staffDeviceVerification=false \
            -e mail__transport=Direct \
            ghost:6
          for i in $(seq 1 90); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:2368/ghost/api/admin/site/)" = "200" ]; then echo "Ghost is up"; exit 0; fi
            sleep 2
          done
          echo "Ghost did not start"; docker logs ghost | tail -50; exit 1
      - name: Build the demo site
        run: |
          zip -qr dungeon.zip . -x '.git/*' '.github/*' 'docs/*' 'demo/*' 'extras/*' 'node_modules/*' 'package-lock.json' '.gitignore'
          GHOST_URL=http://localhost:2368 THEME_ZIP=dungeon.zip OUT_DIR=demo-site node demo/build.mjs
      - name: Keep a copy of the built demo
        uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: demo-site
          retention-days: 7
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set; the demo was built (see the demo-site artifact) but not deployed."
            exit 0
          fi
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy demo-site --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
