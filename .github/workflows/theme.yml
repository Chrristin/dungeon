# Checks the theme with Ghost's validator on every push and pull request.
# When you publish a GitHub release, it also builds the theme zip and attaches it to the release.
name: Theme

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate for Ghost 5 and 6
        run: |
          npx --yes gscan . --v5
          npx --yes gscan . --v6

  release:
    if: github.event_name == 'release'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: zip -r "dungeon-${{ github.event.release.tag_name }}.zip" . -x '.git/*' '.github/*' 'docs/*' '.gitignore'
      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dungeon-${{ github.event.release.tag_name }}.zip" --clobber
