# On every push to main: check the theme with Ghost's validator.
# If package.json has a version with no release yet, publish it automatically:
# tag v<version>, build dungeon-v<version>.zip, and use that version's CHANGELOG.md section as notes.
name: Theme

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate for Ghost 5 and 6
        run: |
          npx --yes gscan . --v5
          npx --yes gscan . --v6

  release:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Skip if this version is already released
        id: exists
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists; nothing to do."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the zip and release notes
        if: steps.exists.outputs.released == 'false'
        run: |
          V="${{ steps.version.outputs.version }}"
          zip -r "dungeon-v$V.zip" . -x '.git/*' '.github/*' 'docs/*' '.gitignore'
          awk -v v="$V" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Dungeon $V" > notes.md
          cat notes.md
      - name: Publish the release
        if: steps.exists.outputs.released == 'false'
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release create "v$V" "dungeon-v$V.zip" --title "Dungeon $V" --notes-file notes.md --target "${{ github.sha }}"
